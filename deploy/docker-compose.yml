services:
  odoo-mcp:
    build:
      context: ../odoo_mcp_server
    user: "${ODOO_MCP_RUN_UID:-1000}:${ODOO_MCP_RUN_GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ODOO_MCP_BIND:-0.0.0.0}:8443:8443"
    volumes:
      - ./audit:/var/log/odoo-mcp:z
      - ./certs:/run/odoo-mcp/certs:ro,z
